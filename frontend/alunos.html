<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos Cadastrados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body>
    <h1>Alunos Cadastrados</h1>
    <a href="/">Voltar</a> | <a href="/cadastro-aluno">Cadastrar Novo Aluno</a>
    <br><br>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h5 class="card-title fw-bold mb-3">
                🔎 Filtrar alunos
            </h5>
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="campoFiltro" class="form-label"> Filtrar por </label>
                    <select id="campoFiltro" class="form-select">
                        <option value="codAluno"> Código </option>
                        <option value="nome"> Nome </option>
                        <option value="cpf"> CPF </option>
                        <option value="email"> E-mail </option>
                        <option value="data_nascimento"> Data de nascimento </option>
                        <option value="telefone"> Telefone </option>
                        <option value="cidade"> Cidade </option>
                    </select>
                </div>
                <div class="col-md-7">
                    <label for="textoFiltro" class="form-label"> Pesquisar </label>
                    <input type="text" id="textoFiltro" class="form-control" placeholder="Digite o que deseja pesquisar...">
                </div>
                <div class="col-md-2">
                    <button type="button" id="btnLimparFiltro" class="btn btn-secondary w-100"> Limpar </button>
                </div>
            </div>
        </div>
    </div>

    <table border="1">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>E-mail</th>
                <th>Data de Nascimento</th>
                <th>Telefone</th>
                <th>RA</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody id="listaAlunos">
        </tbody>
    </table>

    <script src="/frontend/js/aluno.js"></script>
</body>
</html>
